<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMIT Robot Control Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .camera-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        #camera-feed {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
        }

        .camera-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .control-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .control-mode {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .mode-switch {
            display: flex;
            background: #e9ecef;
            border-radius: 25px;
            padding: 5px;
        }

        .mode-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .mode-btn:not(.active) {
            background: transparent;
            color: #666;
        }

        .joystick-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .joystick {
            width: 200px;
            height: 200px;
            border: 3px solid #667eea;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, #f8f9fa 0%, #e9ecef 100%);
            cursor: pointer;
            touch-action: none;
        }

        .joystick-knob {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.1s ease;
        }

        .arrow-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 200px;
            margin: 0 auto 20px;
        }

        .arrow-controls.active {
            display: grid;
        }

        .arrow-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .arrow-btn:active {
            transform: scale(0.95);
        }

        .status-section {
            grid-column: 1 / -1;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .status-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .status-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .status-label {
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .joystick {
                width: 150px;
                height: 150px;
            }
            
            .joystick-knob {
                width: 45px;
                height: 45px;
            }
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            z-index: 1000;
        }

        .connected {
            background: #28a745;
        }

        .disconnected {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connection-status">Connecting...</div>
    
    <div class="container">
        <div class="header">
            <h1>🤖 RMIT Robot Control</h1>
            <p>Advanced Mecanum Drive Control Interface</p>
        </div>

        <div class="main-content">
            <div class="camera-section">
                <h3>📹 Camera Feed</h3>
                <div class="camera-container">
                    <img id="camera-feed" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQwIiBoZWlnaHQ9IjQ4MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjY2NjIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPldhaXRpbmcgZm9yIGNhbWVyYS4uLjwvdGV4dD48L3N2Zz4=" alt="Camera Feed">
                </div>
                <div class="camera-info">
                    <span>FPS: <span id="camera-fps">0</span></span>
                    <span>Resolution: 640x480</span>
                </div>
            </div>

            <div class="control-section">
                <h3>🎮 Robot Control</h3>
                
                <div class="control-mode">
                    <div class="mode-switch">
                        <button class="mode-btn active" id="joystick-mode">Joystick</button>
                        <button class="mode-btn" id="arrow-mode">Arrow Keys</button>
                    </div>
                </div>

                <div class="joystick-container" id="joystick-container">
                    <div class="joystick" id="joystick">
                        <div class="joystick-knob" id="joystick-knob"></div>
                    </div>
                </div>

                <div class="arrow-controls" id="arrow-controls">
                    <div></div>
                    <button class="arrow-btn" id="forward">↑</button>
                    <div></div>
                    <button class="arrow-btn" id="left">←</button>
                    <button class="arrow-btn" id="stop">⏹</button>
                    <button class="arrow-btn" id="right">→</button>
                    <div></div>
                    <button class="arrow-btn" id="backward">↓</button>
                    <div></div>
                </div>
            </div>
        </div>

        <div class="status-section">
            <h3>📊 Robot Status</h3>
            <div class="status-grid">
                <div class="status-card">
                    <div class="status-value" id="pos-x">0.00</div>
                    <div class="status-label">Position X (m)</div>
                </div>
                <div class="status-card">
                    <div class="status-value" id="pos-y">0.00</div>
                    <div class="status-label">Position Y (m)</div>
                </div>
                <div class="status-card">
                    <div class="status-value" id="pos-theta">0.00</div>
                    <div class="status-label">Orientation (rad)</div>
                </div>
                <div class="status-card">
                    <div class="status-value" id="vel-linear">0.00</div>
                    <div class="status-label">Linear Velocity (m/s)</div>
                </div>
                <div class="status-card">
                    <div class="status-value" id="vel-angular">0.00</div>
                    <div class="status-label">Angular Velocity (rad/s)</div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
